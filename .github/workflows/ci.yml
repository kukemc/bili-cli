name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e ".[dev]"
      - name: Smoke test the CLI
        run: |
          bili --version
          bili schema --compact
      - name: Tests
        run: pytest -q

  installer:
    # Run the one-line installers end to end on clean machines, from the checked-out code.
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          BILI_CLI_SOURCE: ${{ github.workspace }}
        run: |
          mkdir -p "$HOME/.claude"   # pretend Claude Code is installed
          sh scripts/install.sh
          export PATH="$HOME/.local/bin:$PATH"
          bili skills status --pretty
          test -f "$HOME/.agents/skills/bili-cli/SKILL.md"
          test -f "$HOME/.claude/skills/bili-cli/references/commands.md"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BILI_CLI_SOURCE: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.claude" | Out-Null
          ./scripts/install.ps1
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          bili skills status --pretty
          if (-not (Test-Path "$env:USERPROFILE\.agents\skills\bili-cli\SKILL.md")) { throw "skill missing in ~/.agents" }
          if (-not (Test-Path "$env:USERPROFILE\.claude\skills\bili-cli\references\commands.md")) { throw "skill missing in ~/.claude" }
