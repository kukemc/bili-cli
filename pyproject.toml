[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bili-cli"
version = "0.1.0"
description = "Bilibili command-line tool designed for AI agents: JSON output, stable error codes, zero interaction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # upstream was archived in 2026-07; pin the last release so nothing new can slip in under this name
    "bilibili-api-python==17.4.2",
    "typer>=0.12",
    "qrcode[pil]>=7.4",
    "httpx>=0.27",
    "curl_cffi>=0.7",
]
keywords = ["bilibili", "cli", "agent", "ai"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
bili = "bili_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bili_cli"]

[tool.hatch.build.targets.wheel.force-include]
# the Agent Skill lives at the repo root (for `npx skills add`) and ships inside the package
"skills/bili-cli" = "bili_cli/_skills/bili-cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
